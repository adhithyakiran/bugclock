[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugclock"
version = "0.1.0"
description = "Track debugging time spent on AI-generated code"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["bugclock", "ai", "debugging", "productivity", "developer-tools", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
bugclock = "claude_debug_tracker.cli:cli"

[project.urls]
Homepage = "https://github.com/adhithyakiran/bugclock"
Issues = "https://github.com/adhithyakiran/bugclock/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_debug_tracker*"]
